name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: loop
          POSTGRES_PASSWORD: loop
          POSTGRES_DB: loop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U loop -d loop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7

      - run: deno fmt --check

      - run: deno lint

      - run: deno task check

      - name: apply migrations to a fresh database
        run: deno task db:migrate:prod
        env:
          DATABASE_URL: postgres://loop:loop@127.0.0.1:5432/loop

      - run: deno task test
        env:
          TEST_DATABASE_URL: postgres://loop:loop@127.0.0.1:5432/loop

  image:
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
